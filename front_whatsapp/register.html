<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Uatizap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <div class="container">

        <div>
            <img class="img" src="public/img/phone-call.png" alt="Icone de chamada">
        </div>
        
        <div class="display">
            <h1>Crie sua conta</h1>
        </div>

        <form id="form-register" class="form-container">
            
            <!-- Campo: Nome Completo -->
            <div class="field-wrapper">
                <label for="nome">Nome Completo</label>
                <div class="input-box">
                    <input class="input-custom" type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
            </div>

            <!-- Campo: Telefone + DDI -->
            <div class="field-wrapper">
                <label for="tel">Telefone</label>
                <div class="group-input-custom">
                    <!-- Select Customizado sem JS -->
                    <div class="select-wrapper" tabindex="0">
                        <input type="radio" name="ddi" id="br" value="+55" checked>
                        <input type="radio" name="ddi" id="us" value="+1">

                        <div class="select-trigger">
                            <div class="selected-option br-selected">
                                <img src="https://flagcdn.com/w40/br.png" alt="Brasil">
                                <span>+55</span>
                            </div>
                            <div class="selected-option us-selected">
                                <img src="https://flagcdn.com/w40/us.png" alt="EUA">
                                <span>+1</span>
                            </div>
                            <span class="chevron"></span>
                        </div>

                        <div class="select-options">
                            <label for="br" class="option br-option">
                                <img src="https://flagcdn.com/w40/br.png" alt="Brasil">
                                <span>+55 (BR)</span>
                            </label>
                            <label for="us" class="option us-option">
                                <img src="https://flagcdn.com/w40/us.png" alt="EUA">
                                <span>+1 (US)</span>
                            </label>
                        </div>
                    </div>

                    <input class="input-custom" type="tel" name="tel" id="tel" placeholder="19 98511634" required>
                </div>
            </div>

            <!-- Campo: Senha -->
            <div class="field-wrapper">
                <label for="password">Senha</label>
                <div class="input-box">
                    <input class="input-custom" type="password" id="password" name="password" placeholder="Crie uma senha (mínimo 6 caracteres)" minlength="6" required>
                </div>
            </div>

            <!-- Campo: Confirmar Senha -->
            <div class="field-wrapper">
                <label for="confirm-password">Confirmar Senha</label>
                <div class="input-box">
                    <input class="input-custom" type="password" id="confirm-password" name="confirm-password" placeholder="Repita a senha" required>
                </div>
            </div>

            <!-- Botão Cadastrar -->
            <div class="group-btn-custom">
                <button type="submit" id="btn-register" class="btn-custom">Cadastrar</button>
            </div>

        </form>

        <div class="group">
            <span>Já possui uma conta?</span>
            <a href="index.html"><strong>Entrar</strong></a>
        </div>

    </div>

    <script src="js/register.js"></script>
</body>

</html>
