<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uatizap - Web</title>
    <!-- Ícones do Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <div class="app-container">
        <!-- BARRA LATERAL (LISTA DE CONVERSAS) -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <img src="https://i.pravatar.cc/150?img=68" class="avatar" alt="Meu Perfil">
                <div class="header-actions">
                    <button title="Comunidades"><i class="fa-solid fa-users"></i></button>
                    <button title="Status"><i class="fa-solid fa-circle-notch"></i></button>
                    <button title="Nova conversa"><i class="fa-solid fa-message"></i></button>
                    <button title="Mais opções"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </header>

            <!-- Campo de Busca -->
            <div class="search-box">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Pesquisar ou começar uma nova conversa">
                </div>
            </div>

            <!-- Lista de Contatos -->
            <div class="chat-list" id="chat-list">    
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL DE CONVERSA -->
        <main class="chat-main">
            <!-- Cabeçalho do Chat -->
            <header class="chat-header">
                <div class="chat-user-details">
                    <img id="chat-header-avatar" src="https://thumbs.dreamstime.com/b/default-profile-picture-avatar-photo-placeholder-vector-illustration-default-profile-picture-avatar-photo-placeholder-vector-189495158.jpg" class="avatar" alt="Foto do Contato">
                    <div class="user-status">
                        <h2 id="chat-header-name">Selecione uma conversa</h2>
                        <span id="chat-header-status"></span>
                    </div>
                </div>
                <div class="header-actions">
                    <button title="Pesquisar na conversa"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button title="Mais opções"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </header>

            <!-- Mensagens -->
            <div class="chat-messages" id="chat-messages">
                <div class="message-date"><span>Selecione um contato para iniciar a conversa</span></div>
            </div>

            <!-- Rodapé / Campo de Entrada -->
            <footer class="chat-footer">
                <button class="icon-btn" title="Emojis"><i class="fa-regular fa-face-smile"></i></button>
                <button class="icon-btn" title="Anexar"><i class="fa-solid fa-paperclip"></i></button>
                
                <form id="chat-form" class="chat-input-form">
                    <input type="text" id="message-input" placeholder="Digite uma mensagem" autocomplete="off">
                    <button type="submit" class="send-btn" id="send-btn" title="Enviar">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
